const ymd=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},today=()=>ymd(Date.now()),add=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ymd(d)},diff=(a,b)=>Math.round((new Date(a+'T00:00')-new Date(b+'T00:00'))/864e5);

const c=[pct(()=>1),den?100*rs.done/den:0,mockPct('P'),mockPct('M'),100*met/30],sum=w.reduce((a,b)=>a+b,0)||1;return{c,score:c.reduce((a,x,i)=>a+x*w[i],0)/sum}}

let days=[];for(let i=13;i>=0;i--)days.push(dayH(add(t,-i)));const mx=Math.max(1,...days);let hm='';for(let i=104;i>=0;i--){const h=dayH(add(t,-i)),a=h==0?0:Math.min(1,.25+h/tg*.75);hm+='<i title="'+add(t,-i)+': '+fh(h)+'" style="'+(a?'background:var(--a);opacity:'+a:'')+'"></i>'}

(dn>=tg?'<p style="color:var(--ok)">Daily target reached.</p>':'<p>'+fh(tg-dn)+' left to reach today\'s target.</p>')+bar(100*dn/tg)+
'<h3>Syllabus</h3><div class="g">'+card('Overall',(all?100*dd/all:0).toFixed(1)+'%')+card('Prelims',pct(x=>x.p[0]=='P').toFixed(1)+'%')+card('Mains',pct(x=>x.p[0]=='M').toFixed(1)+'%')+card('Completed / in progress',dd+' / '+ip)+'</div>'+
'<h3>Last 14 days (hours)</h3><div class="bars">'+Q(days,h=>'<i title="'+fh(h)+'" style="height:'+100*h/mx+'%"></i>')+'</div><h3>Activity (15 weeks)</h3><div class="hm">'+hm+'</div>'+

let cur='';let lastP='';ALL.forEach(x=>{if(x.p!=lastP){cur+=(lastP?'</optgroup>':'')+'<optgroup label="'+x.p+'">';lastP=x.p}cur+='<option value="'+x.id+'">'+x.u+' › '+x.n+'</option>'});cur+='</optgroup>';
return'<h2>Study timer</h2><div class="k"><div class="tm" id="tv">00:00:00</div><div id="ph" style="color:var(--m)"></div><div class="row">'+
(m?'':'<select id="tt">'+cur+'</select><select id="tmo"><option value="0">Stopwatch</option><option value="25">Pomodoro 25/5</option><option value="50">Pomodoro 50/10</option><option value="c">Custom Pomodoro</option></select><input id="td" placeholder="Session description" style="flex:1">')+'</div><div class="row">'+
(!m?'<button onclick="ts()">Start</button>':(m.run?'<button onclick="tp()">Pause</button>':'<button onclick="tr()">Resume</button>')+'<button class="d" onclick="tx()">Stop &amp; save</button><button class="s" onclick="tz()">Reset</button>')+'</div></div><h3>Add a past session</h3><div class="k"><div class="row"><input id="md" type="date" value="'+today()+'" max="'+today()+'"><input id="mh" type="number" min="0" max="24" placeholder="Hours" style="width:90px"><input id="mi" type="number" min="0" max="59" placeholder="Minutes" style="width:90px"><select id="mt"><option value="">No specific topic</option>'+cur+'</select></div><div class="row"><input id="mdesc" placeholder="Description (optional)" style="flex:1"><button onclick="addman()">Add session</button></div></div><h3>Session history</h3><table><tr><th>Date<th>Topic<th>Study<th>Note<th></tr>'+L+'</table>'},
syll(){const q=(window.sq||'').toLowerCase();let o='<h2>Syllabus tracker</h2><div class="row"><input id="sq" placeholder="Search topics & notes" value="'+(window.sq||'')+'" oninput="sq=this.value;R2()"><select onchange="sf=this.value;R2()"><option value="">All statuses</option>'+Q(ST,s=>'<option'+(window.sf==s?' selected':'')+'>'+s+'</option>')+'</select><button class="s" onclick="addc()">+ Add custom topic</button></div><div id="sl">'+sl()+'</div>';return o},
rev(){const rs=revStats(),row=x=>'<div class="tp"><span>'+x.name+' · R'+x.n+' · '+x.due+'</span><button onclick="rdn('+x.id+')">Mark done</button></div>';const done=S.revs.filter(x=>x.done);
return'<h2>Revision</h2><p>Spaced schedule: 1, 3, 7, 15, 30 days. Completing a topic creates its first revision automatically.</p><h3>Overdue ('+rs.over.length+')</h3>'+Q(rs.over,row)+'<h3>Due today ('+rs.due.length+')</h3>'+Q(rs.due,row)+'<h3>Upcoming ('+rs.up.length+')</h3>'+Q(rs.up,row)+'<h3>Completed ('+done.length+')</h3>'+Q(done.slice(-15),x=>'<div>'+x.name+' · R'+x.n+'</div>')},

function rec(r){const o=[],c=r.c;if(c[0]<50)o.push('Syllabus completion is low: raise daily study time on the least-covered paper.');if(c[1]<60)o.push('Clear overdue revisions before starting new topics.');if(c[2]<60)o.push('Prelims accuracy is low: add daily MCQ practice and analyse mistakes.');if(c[3]<50)o.push('Log more answer-writing practice.');if(c[4]<60)o.push('Consistency is low: set a realistic daily target you can hit.');const w=[...new Set(ALL.map(x=>x.p))].map(p=>[p,pct(x=>x.p==p)]).sort((a,b)=>a[1]-b[1]).slice(0,3);o.push('Weakest sections: '+w.map(x=>x[0]+' ('+x[1].toFixed(0)+'%)').join(', '));return'<ul>'+Q(o,x=>'<li>'+x+'</li>')+'</ul>'}
function sl(){const q=(window.sq||'').toLowerCase(),f=window.sf||'';let o='';for(const p in SY){let pu='';for(const u in SY[p]){const L=ALL.filter(x=>x.p==p&&x.u==u&&(!f||T(x.id).st==f)&&(!q||(x.n+T(x.id).notes).toLowerCase().includes(q)));if(!L.length&&(q||f))continue;const dn=ALL.filter(x=>x.p==p&&x.u==u&&DONE(T(x.id).st)).length,tot=ALL.filter(x=>x.p==p&&x.u==u).length;
pu+='<details'+(q||f?' open':'')+'><summary>'+u+' · '+dn+'/'+tot+'</summary>'+Q(L,x=>{const d=T(x.id);return'<div class="tp"><span>'+x.n+'<br><small style="color:var(--m)">'+fh(d.hrs)+' · rev '+d.rev+(d.done?' · done '+d.done:'')+(d.ref?' · '+d.ref:'')+'</small></span><select onchange="stat(\''+x.id+'\',this.value,1)">'+Q(ST,s=>'<option'+(d.st==s?' selected':'')+'>'+s+'</option>')+'</select><input type="date" title="Target date" value="'+d.target+'" onchange="T(\''+x.id+'\').target=this.value;save()"><button class="s" onclick="nt(\''+x.id+'\')">Notes</button></div>'})+'</details>'}
if(pu){const pp=ALL.filter(x=>x.p==p);o+='<details'+(q||f?' open':'')+'><summary>'+p+' · '+(pp.length?(100*pp.filter(x=>DONE(T(x.id).st)).length/pp.length).toFixed(0):0)+'%</summary>'+pu+'</details>'}}return o}
function R2(){$('#sl').innerHTML=sl()}
function stat(id,s,keep){const d=T(id);d.st=s;if(DONE(s)&&!d.done)d.done=today();if(s=='Completed'||s=='Revision Required'){if(!S.revs.some(r=>r.id==id&&!r.done))S.revs.push({id,rid:Date.now()+Math.random(),name:ALL.find(x=>x.id==id).n,n:d.rev+1,due:add(today(),IV[Math.min(d.rev,4)])})}save();keep?R2():R()}
function nt(id){const d=T(id),n=prompt('Notes',d.notes);if(n===null)return;d.notes=n;const r=prompt('References (NCERT / books)',d.ref);if(r!==null)d.ref=r;const h=prompt('Hours spent (total)',d.hrs.toFixed(1));if(h!==null&&!isNaN(+h))d.hrs=+h;save();R2()}
function addc(){const p=prompt('Paper (e.g. Mains · Optional Paper I)','Mains · Optional Paper I'),u=prompt('Unit','Optional subject (add your topics)'),n=prompt('Topic name');if(!p||!n||!SY[p]||!(u in SY[p]))return alert('Paper or unit not found');S.custom.push({id:p+'|'+u+'|c'+Date.now(),p,u,n});buildAll();save();R()}
function rdn(rid){const r=S.revs.find(x=>x.rid==rid);r.done=today();const d=T(r.id);d.rev=r.n;if(r.n<5){S.revs.push({id:r.id,rid:Date.now()+Math.random(),name:r.name,n:r.n+1,due:add(today(),IV[r.n])});d.st='Currently Studying'==d.st?d.st:'Completed'}else d.st='Fully Revised';save();R()}
function dist(){const cap=Math.max(1,Math.floor(S.set.daily/2)),t=today(),per={};ALL.filter(x=>{const d=T(x.id);return d.target&&d.target<=t&&!DONE(d.st)}).forEach(x=>{let k=1;while((per[add(t,k)]||0)>=cap)k++;const dt=add(t,k);per[dt]=(per[dt]||0)+1;T(x.id).target=dt});save();R();}
function addm(){const s=+$('#ms').value,mx=+$('#mx').value;if(!(mx>0)||isNaN(s)||s<0||s>mx)return alert('Enter valid marks and maximum');S.mocks.push({d:today(),k:$('#mk').value,n:$('#mn').value||'Test',s,max:mx,w:$('#mw').value});save();R()}
let iv;function tick(){clearInterval(iv);const m=S.timer;if(!m){$('#tv').textContent='00:00:00';return}const u=()=>{const e=m.acc+(m.run?Date.now()-m.t0:0),p=sp(m,e),x=Math.floor(p.s/1e3),z=n=>String(n).padStart(2,'0');$('#tv').textContent=z(x/3600|0)+':'+z(x/60%60|0)+':'+z(x%60);$('#ph').textContent=(m.run?'Running':'Paused')+(m.w?' · '+(p.br?'Break':'Focus')+' · break total '+Math.round(p.b/6e4)+'m':'')};u();iv=setInterval(u,500)}
function sp(m,e){if(!m.w)return{s:e,b:0,br:0};const W=m.w*6e4,C=W+m.b*6e4,f=Math.floor(e/C),r=e%C,s=f*W+Math.min(r,W);return{s,b:e-s,br:r>=W}}
function ts(){let w=+$('#tmo').value||0,b=w==25?5:10;if($('#tmo').value=='c'){w=S.set.pw;b=S.set.pb}S.timer={acc:0,run:1,t0:Date.now(),id:$('#tt').value,desc:$('#td').value,w,b,date:today()};save();R()}
function tp(){const m=S.timer;m.acc+=Date.now()-m.t0;m.run=0;save();R()}
function tr(){const m=S.timer;m.t0=Date.now();m.run=1;save();R()}
function tz(){if(confirm('Discard this session?')){S.timer=null;save();R()}}
function tx(){const m=S.timer,e=m.acc+(m.run?Date.now()-m.t0:0),p=sp(m,e),t=ALL.find(x=>x.id==m.id);S.sessions.push({id:Date.now(),date:m.date,study:p.s,brk:p.b,tid:m.id,name:t?t.n:'',desc:m.desc});if(t){const d=T(m.id);d.hrs+=hrs(p.s);if(d.st==ST[0])d.st=ST[1]}S.timer=null;save();R()}
function addman(){const d=$('#md').value,h=+$('#mh').value||0,mi=+$('#mi').value||0,tot=h+mi/60;if(!d||d>today())return alert('Choose today or an earlier date.');if(h<0||mi<0||tot<=0||tot>24)return alert('Enter a duration between 1 minute and 24 hours.');const id=$('#mt').value,t=ALL.find(x=>x.id==id);S.sessions.push({id:Date.now(),date:d,study:tot*36e5,brk:0,tid:t?id:'',name:t?t.n:'',desc:$('#mdesc').value,manual:1});if(t){const q=T(id);q.hrs+=tot;if(q.st==ST[0])q.st=ST[1]}save();R()}
function dls(id){if(confirm('Delete this session?')){S.sessions=S.sessions.filter(x=>x.id!=id);save();R()}}
function eds(id){const x=S.sessions.find(s=>s.id==id),h=prompt('Study hours',hrs(x.study).toFixed(2));if(h===null||isNaN(+h))return;const o=x.study;x.study=+h*36e5;x.desc=prompt('Description',x.desc)??x.desc;if(x.tid)T(x.tid).hrs=Math.max(0,T(x.tid).hrs+hrs(x.study-o));save();R()}
function dl(n,t,ty){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()}
function bk(){dl('upsc-backup-'+today()+'.json',JSON.stringify(S),'application/json')}
function rs(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.sessions)||!d.topics||!d.set)throw 0;if(!confirm('Replace current data with this backup?'))return;S=Object.assign(DEF(),d);buildAll();save();R()}catch(e){alert('Invalid backup file')}};r.readAsText(f)}
function csv(){dl('sessions.csv','date,topic,study_hours,break_min,description\n'+S.sessions.map(x=>[x.date,'"'+x.name+'"',hrs(x.study).toFixed(2),Math.round(x.brk/6e4),'"'+x.desc+'"'].join(',')).join('\n'),'text/csv')}
(async()=>{await open();S=Object.assign(DEF(),await get()||{});buildAll();R();setInterval(()=>{if(view=='dash')R()},6e4);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script></body></html>
